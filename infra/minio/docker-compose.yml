name: nowbox-minio

x-image: &image cgr.dev/chainguard/minio:latest@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]

services:
  minio:
    <<: *hardening
    image: *image
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "--config-dir", "/tmp/.mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    pids_limit: 256
    mem_limit: 1g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  minio-init:
    <<: *hardening
    image: *image
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-nowbox}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?defina MINIO_APP_ACCESS_KEY no .env}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?defina MINIO_APP_SECRET_KEY no .env}
      MINIO_BUCKET_CONTRATOS: ${MINIO_BUCKET_CONTRATOS:-nowbox-contratos}
      MINIO_BUCKET_DOCUMENTOS: ${MINIO_BUCKET_DOCUMENTOS:-nowbox-documentos}
      MINIO_JOBS_ACCESS_KEY: ${MINIO_JOBS_ACCESS_KEY:?defina MINIO_JOBS_ACCESS_KEY no .env}
      MINIO_JOBS_SECRET_KEY: ${MINIO_JOBS_SECRET_KEY:?defina MINIO_JOBS_SECRET_KEY no .env}
      MINIO_API_ACCESS_KEY: ${MINIO_API_ACCESS_KEY:?defina MINIO_API_ACCESS_KEY no .env}
      MINIO_API_SECRET_KEY: ${MINIO_API_SECRET_KEY:?defina MINIO_API_SECRET_KEY no .env}
      MC_CONFIG_DIR: /tmp/.mc
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set none "local/$$MINIO_BUCKET"
        cat > /tmp/policy.json <<EOF
        {"Version":"2012-10-17","Statement":[
          {"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation"],"Resource":["arn:aws:s3:::$$MINIO_BUCKET"]},
          {"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::$$MINIO_BUCKET/*"]}
        ]}
        EOF
        mc admin policy create local nowbox-app /tmp/policy.json
        mc admin user add local "$$MINIO_APP_ACCESS_KEY" "$$MINIO_APP_SECRET_KEY"
        mc admin policy attach local nowbox-app --user "$$MINIO_APP_ACCESS_KEY" || true

        # Bucket exclusivo de contratos: privado, sem acesso anonimo e sem URL publica.
        # O worker nowbox-jobs so grava e a API so le depois de validar a permissao do usuario
        mc mb --ignore-existing "local/$$MINIO_BUCKET_CONTRATOS"
        mc anonymous set none "local/$$MINIO_BUCKET_CONTRATOS"

        cat > /tmp/contratos-escrita.json <<EOF
        {"Version":"2012-10-17","Statement":[
          {"Effect":"Allow","Action":["s3:PutObject"],"Resource":["arn:aws:s3:::$$MINIO_BUCKET_CONTRATOS/*"]}
        ]}
        EOF
        mc admin policy create local nowbox-contratos-escrita /tmp/contratos-escrita.json
        mc admin user add local "$$MINIO_JOBS_ACCESS_KEY" "$$MINIO_JOBS_SECRET_KEY"
        mc admin policy attach local nowbox-contratos-escrita --user "$$MINIO_JOBS_ACCESS_KEY" || true

        cat > /tmp/contratos-leitura.json <<EOF
        {"Version":"2012-10-17","Statement":[
          {"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation"],"Resource":["arn:aws:s3:::$$MINIO_BUCKET_CONTRATOS"]},
          {"Effect":"Allow","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::$$MINIO_BUCKET_CONTRATOS/*"]}
        ]}
        EOF
        mc admin policy create local nowbox-contratos-leitura /tmp/contratos-leitura.json
        mc admin user add local "$$MINIO_API_ACCESS_KEY" "$$MINIO_API_SECRET_KEY"
        mc admin policy attach local nowbox-contratos-leitura --user "$$MINIO_API_ACCESS_KEY" || true

        mc mb --ignore-existing "local/$$MINIO_BUCKET_DOCUMENTOS"
        mc anonymous set none "local/$$MINIO_BUCKET_DOCUMENTOS"

        cat > /tmp/documentos-api.json <<EOF
        {"Version":"2012-10-17","Statement":[
          {"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation"],"Resource":["arn:aws:s3:::$$MINIO_BUCKET_DOCUMENTOS"]},
          {"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::$$MINIO_BUCKET_DOCUMENTOS/*"]}
        ]}
        EOF
        mc admin policy create local nowbox-documentos-api /tmp/documentos-api.json
        mc admin policy attach local nowbox-documentos-api --user "$$MINIO_API_ACCESS_KEY" || true

volumes:
  minio-data:
